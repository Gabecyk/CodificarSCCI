services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codificarscci_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: codificar
      DB_USERNAME: postgres
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: codificarscci_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: codificar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: codificarscci_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
